name: TicketDesk Deploy

# M6: push to main -> test -> secret scan -> build -> push to ECR ->
# update the ECS service -> smoke test. Any failing step blocks the ones
# after it (each job below `needs` the one before), so a broken test or a
# committed secret never reaches AWS.
#
# One-time setup (see infra/README.md for how to get these values):
#   Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#     AWS_REGION                 - e.g. us-east-1
#     ECR_REPOSITORY_URL         - infra output: ecr_repository_url
#     ECS_CLUSTER                - infra output: ecs_cluster_name
#     ECS_SERVICE                - infra output: ecs_service_name
#     APP_URL                    - infra output: frontend_url (or alb_dns_name)
#     LAMBDA_ECR_REPOSITORY_URL  - infra output: lambda_thumbnail_ecr_repository_url
#     LAMBDA_FUNCTION_NAME       - infra output: lambda_thumbnail_function_name
#   Repo secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#     AWS_ACCESS_KEY_ID     - infra output: github_actions_access_key_id
#     AWS_SECRET_ACCESS_KEY - infra output: github_actions_secret_access_key
#
# Using a long-lived IAM user access key here, not OIDC federation - the
# OIDC role (infra/github_oidc.tf) hits an unresolvable AccessDenied on
# this AWS account/sandbox (see NOTES.md: trust policy verified correct
# against the actual token, AWS Support unavailable in this environment).
# Swap back to OIDC (delete the "Configure AWS credentials" step below,
# uncomment the block after it, add `permissions: id-token: write` to
# both jobs) if that's ever resolved.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./ticketdesk_ci.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # exclude-detectors=Lob: Lob (postal mail API) isn't used
          # anywhere in this project, and its key format ("test_..."/
          # "live_..." followed by alphanumerics) happens to match
          # ordinary pytest function names like
          # test_agents_list_requires_agent_or_admin - a confirmed false
          # positive (verified locally against the real repo history on
          # 2026-08-13: the two "verified" hits were exactly those two
          # test names, not credentials). Every other detector still runs.
          extra_args: --only-verified --exclude-detectors=Lob

  # Everything below only runs on a push to main - a PR gets test +
  # secret-scan for review, not a deployment.
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, secret-scan]
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # OIDC version (preferred - no long-lived credential in GitHub).
      # Swap back to this once the account-level AssumeRoleWithWebIdentity
      # block is resolved (see NOTES.md), and add
      # `permissions: {id-token: write, contents: read}` to this job.
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tagged with the commit SHA, never latest)
        id: image
        env:
          REPO_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$REPO_URL:$TAG" .
          docker push "$REPO_URL:$TAG"
          echo "image=$REPO_URL:$TAG" >> "$GITHUB_OUTPUT"

  # Independent of build-and-push/deploy below - a different image and a
  # different AWS service (Lambda, not ECS) - so it runs in parallel
  # rather than gating the API deployment on thumbnailer success or vice
  # versa. Previously a manual step (infra/README.md steps 6-7); this is
  # the M6 gap called out in README.md/NOTES.md as "not automated yet".
  build-and-deploy-lambda:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, secret-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fails fast with a clear message instead of the cryptic Docker
      # error ("invalid tag ':abc1234'") that shows up otherwise when
      # these two repo variables (Settings -> Secrets and variables ->
      # Actions -> Variables) haven't been set yet - infra output:
      # lambda_thumbnail_ecr_repository_url / lambda_thumbnail_function_name.
      - name: Verify required repo variables are set
        run: |
          missing=0
          if [ -z "${{ vars.LAMBDA_ECR_REPOSITORY_URL }}" ]; then
            echo "::error::Repo variable LAMBDA_ECR_REPOSITORY_URL is not set (Settings > Secrets and variables > Actions > Variables). Value: terraform output -raw lambda_thumbnail_ecr_repository_url"
            missing=1
          fi
          if [ -z "${{ vars.LAMBDA_FUNCTION_NAME }}" ]; then
            echo "::error::Repo variable LAMBDA_FUNCTION_NAME is not set (Settings > Secrets and variables > Actions > Variables). Value: terraform output -raw lambda_thumbnail_function_name"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # OIDC version - see the comment in build-and-push above.
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ECR has image-tag immutability on (by design - see infra), so a
      # re-run of this job for the same commit (e.g. retrying only this
      # job after an earlier partial failure) can't re-push the same
      # commit-SHA tag - ECR rejects it outright ("tag ... is immutable"),
      # even though the image content would be identical. Skip the
      # build/push when that tag is already present instead of failing.
      - name: Check if image tag already exists in ECR
        id: check-image
        env:
          REPO_URL: ${{ vars.LAMBDA_ECR_REPOSITORY_URL }}
        run: |
          TAG="${GITHUB_SHA::7}"
          REPO_NAME="${REPO_URL##*/}"
          echo "IMAGE=$REPO_URL:$TAG" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push thumbnailer image (tagged with the commit SHA)
        if: steps.check-image.outputs.exists != 'true'
        env:
          REPO_URL: ${{ vars.LAMBDA_ECR_REPOSITORY_URL }}
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$REPO_URL:$TAG" lambda/thumbnail
          docker push "$REPO_URL:$TAG"

      - name: Update Lambda function code and wait for it to finish updating
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "$IMAGE" \
            --publish
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # OIDC version - see the comment in build-and-push above.
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$(aws ecs describe-services \
              --cluster "${{ vars.ECS_CLUSTER }}" \
              --services "${{ vars.ECS_SERVICE }}" \
              --query 'services[0].taskDefinition' --output text)" \
            --query 'taskDefinition' > task-definition.json

      - name: Update image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ticketdesk-api
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS (waits for the service to reach steady state)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Hit the deployed health endpoint
        run: |
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" "${{ vars.APP_URL }}/api/health")
          cat /tmp/body
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: got HTTP $STATUS"
            exit 1
          fi
          grep -q '"status":"UP"' /tmp/body || (echo "Unexpected health response" && exit 1)
